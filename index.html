<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {

  }
  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* Opening Screen UI */
  #opening-screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 10vh;
    pointer-events: none;
    transition: opacity 1.5s ease, visibility 1.5s;
  }
  #opening-screen .opening-hint-wrapper {
    position: absolute;
    top: 52%;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
  }
  #opening-screen.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .opening-text {
    color: rgba(215, 200, 180, 0.65);
    font-size: clamp(1.8rem, 4vw, 4.2rem);
    font-weight: 300;
    letter-spacing: 0.18em;
    line-height: 1.35;
    text-align: center;
    text-shadow: 0 2px 16px rgba(0,0,0,0.9);
    margin-bottom: 48px;
  }
  .opening-text .en-title {
    display: block;
    margin-top: 0.8rem;
    font-size: clamp(0.72rem, 1.2vw, 1.05rem);
    letter-spacing: 0.32em;
    color: rgba(255, 220, 165, 0.44);
    text-transform: uppercase;
  }
  .door-hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    pointer-events: auto;
    animation: floatHint 2.5s ease-in-out infinite;
  }
  .hint-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 200, 120, 0.35);
    background: rgba(255, 180, 80, 0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    color: rgba(255, 210, 140, 0.7);
    transition: all 0.4s;
    box-shadow: 0 0 20px rgba(255, 160, 60, 0.1);
  }
  .door-hint:hover .hint-icon {
    border-color: rgba(255, 220, 160, 0.7);
    background: rgba(255, 200, 100, 0.18);
    color: rgba(255, 235, 180, 0.95);
    box-shadow: 0 0 30px rgba(255, 180, 80, 0.25);
    transform: scale(1.08);
  }
  .hint-text {
    color: rgba(255, 200, 130, 0.5);
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    transition: color 0.4s;
  }
  .door-hint:hover .hint-text {
    color: rgba(255, 235, 180, 0.85);
  }
  @keyframes floatHint {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.65; }
  }

  /* Transition overlays */
  #blackout {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.0s ease;

  #blackout.active {
    opacity: 1;
    pointer-events: auto;
  }

<script>
  (function () {
    if (location.protocol !== 'file:') return;
    const serverUrl = 'http://localhost:8787/';
    window.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('file-mode');
      const enter = document.getElementById('enterHint');
      if (enter) {
        enter.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          location.href = serverUrl;
        }, true);
      }
    });
  })();

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

// ============================================================
// 0. Textures
// ============================================================
function createCardboardTex() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  // Slightly darker, richer base
  ctx.fillStyle = '#ccc5ba';
  ctx.fillRect(0, 0, 512, 512);
  // Fiber streaks (more visible)
  for (let i = 0; i < 18000; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const g = 140 + Math.random() * 60;
    ctx.strokeStyle = `rgba(${g},${g - 10},${g - 20},${0.08 + Math.random() * 0.08})`;
    ctx.lineWidth = 0.2 + Math.random() * 0.8;
    const len = 2 + Math.random() * 10;
    const ang = (Math.random() - 0.5) * 0.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }
  // Larger fiber clumps / blotches for organic feel
  for (let i = 0; i < 80; i++) {
    const x = Math.random() * 512, y = Math.random() * 512, r = 10 + Math.random() * 45;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(185,175,160,0.08)');
    grad.addColorStop(1, 'rgba(185,175,160,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  // Subtle horizontal corrugation lines (cardboard layer feel)
  for (let i = 0; i < 200; i++) {
    const y = Math.random() * 512;
    ctx.strokeStyle = `rgba(160,150,138,${0.02 + Math.random() * 0.03})`;
    ctx.lineWidth = 0.5 + Math.random();
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(512, y + (Math.random() - 0.5) * 2);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function createCardboardBump() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, 512, 512);
  // Fine fiber bumps
  for (let i = 0; i < 12000; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const v = 90 + Math.random() * 70;
    ctx.strokeStyle = `rgb(${v},${v},${v})`;
    ctx.lineWidth = 0.2 + Math.random() * 0.5;
    const len = 2 + Math.random() * 7;
    const ang = (Math.random() - 0.5) * 0.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }
  // Larger irregular bumps for organic unevenness
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * 512, y = Math.random() * 512, r = 5 + Math.random() * 20;
    const v = 100 + Math.random() * 40;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${v},${v},${v},0.15)`);
    grad.addColorStop(1, 'rgba(128,128,128,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  return tex;
}
const cbTex = createCardboardTex();
const cbBump = createCardboardBump();
const textureLoader = new THREE.TextureLoader();
function loadRepeatingTexture(path, repeat = 2.5, isColor = false) {
  const tex = textureLoader.load(path);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.anisotropy = 8;
  if (isColor) tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const cardboardPBR = {
  roughness: loadRepeatingTexture('assets/textures/Cardboard002_1K-JPG_Roughness.jpg', 2.4, false),
  normal: loadRepeatingTexture('assets/textures/Cardboard002_1K-JPG_NormalGL.jpg', 2.4, false),
};
const assetPBR = {
  paper: {
    color: loadRepeatingTexture('assets/textures/Paper001_1K-JPG/Paper001_1K-JPG_Color.jpg', 1.8, true),
    roughness: loadRepeatingTexture('assets/textures/Paper001_1K-JPG/Paper001_1K-JPG_Roughness.jpg', 1.8, false),
    normal: loadRepeatingTexture('assets/textures/Paper001_1K-JPG/Paper001_1K-JPG_NormalGL.jpg', 1.8, false),
  },
  plaster: {
    color: loadRepeatingTexture('assets/textures/Plaster001_1K-JPG/Plaster001_1K-JPG_Color.jpg', 2.1, true),
    roughness: loadRepeatingTexture('assets/textures/Plaster001_1K-JPG/Plaster001_1K-JPG_Roughness.jpg', 2.1, false),
    normal: loadRepeatingTexture('assets/textures/Plaster001_1K-JPG/Plaster001_1K-JPG_NormalGL.jpg', 2.1, false),
  },
  styrofoam: {
    color: loadRepeatingTexture('assets/textures/Styrofoam004_1K-JPG/Styrofoam004_1K-JPG_Color.jpg', 2.0, true),
    roughness: loadRepeatingTexture('assets/textures/Styrofoam004_1K-JPG/Styrofoam004_1K-JPG_Roughness.jpg', 2.0, false),
    normal: loadRepeatingTexture('assets/textures/Styrofoam004_1K-JPG/Styrofoam004_1K-JPG_NormalGL.jpg', 2.0, false),
  },
  tape: {
    color: loadRepeatingTexture('assets/textures/Tape001_1K-JPG/Tape001_1K-JPG_Color.jpg', 1.0, true),
    roughness: loadRepeatingTexture('assets/textures/Tape001_1K-JPG/Tape001_1K-JPG_Roughness.jpg', 1.0, false),
    normal: loadRepeatingTexture('assets/textures/Tape001_1K-JPG/Tape001_1K-JPG_NormalGL.jpg', 1.0, false),
    opacity: loadRepeatingTexture('assets/textures/Tape001_1K-JPG/Tape001_1K-JPG_Opacity.jpg', 1.0, false),
  },
};
function createCardboardRoughness() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const v = 170 + Math.random() * 70;
    ctx.strokeStyle = `rgba(${v},${v},${v},${0.06 + Math.random() * 0.12})`;
    ctx.lineWidth = 0.4 + Math.random() * 1.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 4 + Math.random() * 16, y + (Math.random() - 0.5) * 3);
    ctx.stroke();
  }
  for (let i = 0; i < 42; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const r = 18 + Math.random() * 70;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(110,105,96,0.12)');
    grad.addColorStop(1, 'rgba(232,232,232,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  return tex;
}
function createStudioHDRI() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  const sky = ctx.createLinearGradient(0, 0, 0, 512);
  sky.addColorStop(0, '#1a1c22');
  sky.addColorStop(0.35, '#3d3428');
  sky.addColorStop(0.68, '#201812');
  sky.addColorStop(1, '#060609');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 1024, 512);
  const warm = ctx.createRadialGradient(512, 58, 0, 512, 58, 260);
  warm.addColorStop(0, 'rgba(255,222,170,0.95)');
  warm.addColorStop(0.22, 'rgba(255,185,98,0.34)');
  warm.addColorStop(1, 'rgba(255,185,98,0)');
  ctx.fillStyle = warm;
  ctx.fillRect(0, 0, 1024, 512);
  const cool = ctx.createRadialGradient(160, 230, 0, 160, 230, 240);
  cool.addColorStop(0, 'rgba(90,130,170,0.42)');
  cool.addColorStop(1, 'rgba(90,130,170,0)');
  ctx.fillStyle = cool;
  ctx.fillRect(0, 0, 1024, 512);
  const rightWarm = ctx.createRadialGradient(860, 270, 0, 860, 270, 260);
  rightWarm.addColorStop(0, 'rgba(210,135,80,0.22)');
  rightWarm.addColorStop(1, 'rgba(210,135,80,0)');
  ctx.fillStyle = rightWarm;
  ctx.fillRect(0, 0, 1024, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const cbRough = createCardboardRoughness();
const studioHDRI = createStudioHDRI();

function cbMat(color = 0xc8c0b0) {
  return new THREE.MeshStandardMaterial({
    color,
    map: cbTex,
    normalMap: cardboardPBR.normal,
    normalScale: new THREE.Vector2(0.055, 0.055),
    bumpMap: cardboardPBR.normal ? null : cbBump,
    bumpScale: 0.022,
    roughnessMap: cardboardPBR.roughness || cbRough,
    roughness: 0.96, metalness: 0, flatShading: true,
    envMapIntensity: 0.18
  });
}
function pbrMat(kind, {
  color = 0xffffff,
  repeat = null,
  normalScale = 0.035,
  roughness = 0.92,
  opacity = 1,
  side = THREE.FrontSide,
  envMapIntensity = 0.12,
  transparent = false,
  useColorMap = true,
  alpha = false,
} = {}) {
  const pbr = assetPBR[kind];
  if (!pbr) return cbMat(color);
  const mat = new THREE.MeshStandardMaterial({
    color,
    map: useColorMap ? pbr.color : null,
    normalMap: pbr.normal,
    normalScale: new THREE.Vector2(normalScale, normalScale),
    roughnessMap: pbr.roughness,
    roughness,
    metalness: 0,
    transparent: transparent || opacity < 1 || alpha,
    opacity,
    side,
    envMapIntensity,
    alphaMap: alpha ? pbr.opacity : null,
    flatShading: true,
  });
  if (repeat) {
    [mat.map, mat.normalMap, mat.roughnessMap, mat.alphaMap].filter(Boolean).forEach((tex) => {
      tex.repeat.set(repeat, repeat);
    });
  }
  return mat;
}
function createDustSprite() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
  grad.addColorStop(0, 'rgba(255,230,180,0.9)');
  grad.addColorStop(0.35, 'rgba(255,205,135,0.35)');
  grad.addColorStop(1, 'rgba(255,205,135,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const dustSprite = createDustSprite();
function edgeLines(geo, color = 0x66aacc, opacity = 0.1) {
  const edges = new THREE.EdgesGeometry(geo);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending });
  return new THREE.LineSegments(edges, mat);
}
function makeBox(w, h, d, x, y, z, mat, group) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const edges = edgeLines(geo, 0x66aacc, 0.08);
  edges.position.copy(mesh.position);
  group.add(mesh);
  group.add(edges);
  return mesh;
}
function dustMaterial(color = 0xffe3b0, size = 0.035, opacity = 0.24) {
  return new THREE.PointsMaterial({
    size,
    map: dustSprite,
    color,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });
}
function addSketchPanel(group, x, y, z, w, h, rotY = 0, opacity = 0.72) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 320;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#d8ccba';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = 'rgba(46, 40, 34, 0.22)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const bx = 54 + i * 58 + (Math.random() - 0.5) * 10;
    const by = 70 + (Math.random() - 0.5) * 32;
    const bw = 38 + Math.random() * 54;
    const bh = 44 + Math.random() * 80;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.beginPath();
    ctx.moveTo(bx, by + bh * 0.45);
    ctx.lineTo(bx + bw, by + bh * 0.45 + (Math.random() - 0.5) * 8);
    ctx.moveTo(bx + bw * 0.5, by);
    ctx.lineTo(bx + bw * 0.5 + (Math.random() - 0.5) * 6, by + bh);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(80, 58, 38, 0.16)';
  ctx.lineWidth = 1.4;
  for (let row = 0; row < 7; row++) {
    const yy = 220 + row * 10;
    ctx.beginPath();
    ctx.moveTo(44, yy);
    for (let xPos = 44; xPos < 470; xPos += 18) {
      ctx.lineTo(xPos, yy + Math.sin(xPos * 0.12 + row) * 2 + (Math.random() - 0.5) * 3);
    }
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    opacity,
    color: 0xb7a389,
    side: THREE.DoubleSide
  });
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  panel.position.set(x, y, z);
  panel.rotation.y = rotY;
  group.add(panel);
  const frame = edgeLines(new THREE.BoxGeometry(w, h, 0.01), 0x5c4c3e, 0.14);
  frame.position.copy(panel.position);
  frame.rotation.copy(panel.rotation);
  group.add(frame);
  return panel;
}
function addWallPatchwork(group, wall, count, color = 0xb0a390) {
  for (let i = 0; i < count; i++) {
    const w = 0.45 + Math.random() * 1.2;
    const h = 0.35 + Math.random() * 1.1;
    const mat = cbMat(color + Math.floor(Math.random() * 0x060606));
    let x = 0, y = 0.45 + Math.random() * 3.3, z = 0, rotY = 0;
    if (wall === 'back') { x = -4.3 + Math.random() * 8.6; z = -4.83; }
    if (wall === 'left') { x = -4.83; z = -4.2 + Math.random() * 8.4; rotY = Math.PI / 2; }
    if (wall === 'right') { x = 4.83; z = -4.2 + Math.random() * 8.4; rotY = -Math.PI / 2; }
    const patch = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.018), mat);
    patch.position.set(x, y, z);
    patch.rotation.y = rotY;
    patch.receiveShadow = true;
    group.add(patch);
    const pe = edgeLines(new THREE.BoxGeometry(w, h, 0.018), 0x3a332b, 0.08);
    pe.position.copy(patch.position);
    pe.rotation.copy(patch.rotation);
    group.add(pe);
  }
}
const memoryCards = [];
function createMemoryCardTexture(title, lines = []) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 160;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#eee4d4';

function createSoftLightmapTexture(color = 0x000000, additive = false) {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 256;
  const ctx = c.getContext('2d');
  const r = (color >> 16) & 255;
  const g = (color >> 8) & 255;
  const b = color & 255;
  const grad = ctx.createRadialGradient(128, 128, 12, 128, 128, 128);
  if (additive) {
    grad.addColorStop(0, `rgba(${r},${g},${b},0.86)`);
    grad.addColorStop(0.42, `rgba(${r},${g},${b},0.28)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  } else {
    grad.addColorStop(0, `rgba(${r},${g},${b},0.7)`);
    grad.addColorStop(0.52, `rgba(${r},${g},${b},0.22)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function addFloorLightmap(group, x, z, w, d, color = 0x000000, opacity = 0.18, rot = 0, additive = false) {
  const mat = new THREE.MeshBasicMaterial({
    color,
    map: createSoftLightmapTexture(color, additive),
    transparent: true,
    opacity,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.rotation.z = rot;
  mesh.position.set(x, 0.006, z);
  mesh.renderOrder = additive ? 3 : 2;
  group.add(mesh);
  return mesh;
}
function addHorizontalLightmap(group, x, y, z, w, d, color = 0x000000, opacity = 0.18, rot = 0, additive = false) {
  const mat = new THREE.MeshBasicMaterial({
    color,

  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);

  mesh.rotation.z = rot;
  mesh.position.set(x, y, z);
  mesh.renderOrder = additive ? 5 : 4;
  group.add(mesh);

}
function addWallLightmap(group, x, y, z, w, h, rotY, color = 0x000000, opacity = 0.14, additive = false) {
  const mat = new THREE.MeshBasicMaterial({
    color,
    map: createSoftLightmapTexture(color, additive),

}

const DreamcoreShader = {
  uniforms: {
    tDiffuse: { value: null },
    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    time: { value: 0.0 },
    vignetteColor: { value: new THREE.Color(0x150a18) },
    vignetteIntensity: { value: 0.48 },
    chromaticOffset: { value: 1.0 },
    grainIntensity: { value: 0.025 },
    contrast: { value: 0.94 },
    saturation: { value: 0.92 },
    prepAtmosphere: { value: 0.0 },
    ssaoStrength: { value: 0.0 },
    dofStrength: { value: 0.0 }
  },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 resolution;
    uniform float time;
    uniform vec3 vignetteColor;
    uniform float vignetteIntensity;
    uniform float chromaticOffset;
    uniform float grainIntensity;
    uniform float contrast;
    uniform float saturation;
    uniform float prepAtmosphere;
    uniform float ssaoStrength;
    uniform float dofStrength;
    varying vec2 vUv;
    float rand(vec2 co){ return fract(sin(dot(co.xy,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 uv = vUv;
      vec2 pixel = vec2(1.0)/resolution;
      vec2 dir = uv - 0.5;
      float dist = length(dir);
      vec2 offset = normalize(dir) * dist * chromaticOffset * pixel;
      float r = texture2D(tDiffuse, uv + offset).r;
      float g = texture2D(tDiffuse, uv).g;
      float b = texture2D(tDiffuse, uv - offset).b;
      vec3 color = vec3(r,g,b);
      float focusMask = smoothstep(0.08, 0.58, abs(uv.y - 0.48)) * dofStrength * prepAtmosphere;
      vec3 blur = (
        texture2D(tDiffuse, uv + pixel * vec2(2.0, 1.2)).rgb +
        texture2D(tDiffuse, uv + pixel * vec2(-2.0, -1.2)).rgb +
        texture2D(tDiffuse, uv + pixel * vec2(1.1, -2.0)).rgb +
        texture2D(tDiffuse, uv + pixel * vec2(-1.1, 2.0)).rgb
      ) * 0.25;
      color = mix(color, blur, focusMask * 0.42);
      float lowerAO = smoothstep(0.56, 0.08, uv.y) * 0.46;
      float sideAO = smoothstep(0.24, 0.88, length((uv - 0.5) * vec2(1.18, 0.82))) * 0.32;
      float beamPreserve = smoothstep(0.42, 0.0, abs(uv.x - 0.5)) * smoothstep(0.98, 0.22, uv.y) * 0.36;
      float ao = clamp(1.0 - (lowerAO + sideAO - beamPreserve) * ssaoStrength * prepAtmosphere, 0.58, 1.0);
      color *= ao;
      color = mix(color, color * vec3(1.05, 0.95, 0.82) + vec3(0.015, 0.01, 0.0), prepAtmosphere * 0.16);
      color += (rand(uv + fract(time*0.1)) * 2.0 - 1.0) * grainIntensity;
      float vig = smoothstep(0.25, 1.0, distance(uv, vec2(0.5))) * vignetteIntensity;
      color = mix(color, vignetteColor, vig * 0.45);
      color *= 1.0 - vig * 0.55;
      color = (color - 0.5) * contrast + 0.5;
      float gray = dot(color, vec3(0.299, 0.587, 0.114));
      color = mix(vec3(gray), color, saturation);
      gl_FragColor = vec4(color, 1.0);
    }
  `
};
const dreamcorePass = new ShaderPass(DreamcoreShader);
composer.addPass(dreamcorePass);

// ============================================================
// 5. First-Person Controller
// ============================================================
class FirstPersonController {
  constructor(camera, domElement) {
    this.camera = camera;
    this.domElement = domElement;
    this.position = new THREE.Vector3(0, 1.6, 2.5);
    this.velocity = new THREE.Vector3();
    this.targetVelocity = new THREE.Vector3();
    this.yaw = 0;
    this.pitch = -0.02;
    this.targetYaw = 0;
    this.targetPitch = -0.02;
    this.moveSpeed = 1.5;
    this.lookSpeed = 0.002;
    this.lerpFactor = 0.12;
    this.maxPitchUp = Math.PI / 3;
    this.maxPitchDown = -Math.PI / 4.5;
    this.boundaryMin = new THREE.Vector3(-4, 0, -4);
    this.boundaryMax = new THREE.Vector3(4, 3, 3);
    this.keys = { w: false, a: false, s: false, d: false };
    this.isDragging = false;
    this.lastMouse = { x: 0, y: 0 };
    this.enabled = false;
    this._bindEvents();
    this._updateCamera();
  }

  _bindEvents() {
    window.addEventListener('keydown', (e) => {
      if (!this.enabled) return;
      const k = e.key.toLowerCase();
      if (this.keys.hasOwnProperty(k)) this.keys[k] = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (this.keys.hasOwnProperty(k)) this.keys[k] = false;
    });
    this.domElement.addEventListener('mousedown', (e) => {
      if (!this.enabled) return;
      this.isDragging = true;
      this.lastMouse.x = e.clientX;
      this.lastMouse.y = e.clientY;
    });
    window.addEventListener('mouseup', () => { this.isDragging = false; });
    window.addEventListener('mousemove', (e) => {
      if (!this.enabled || !this.isDragging) return;
      const dx = e.clientX - this.lastMouse.x;
      const dy = e.clientY - this.lastMouse.y;
      this.lastMouse.x = e.clientX;
      this.lastMouse.y = e.clientY;
      this.targetYaw -= dx * this.lookSpeed;
      this.targetPitch -= dy * this.lookSpeed;
      this.targetPitch = THREE.MathUtils.clamp(this.targetPitch, this.maxPitchDown, this.maxPitchUp);
    });
    this.domElement.addEventListener('touchstart', (e) => {
      if (!this.enabled) return;
      if (e.touches.length === 1) {
        this.isDragging = true;
        this.lastMouse.x = e.touches[0].clientX;
        this.lastMouse.y = e.touches[0].clientY;
      }
    }, { passive: false });
    window.addEventListener('touchend', () => { this.isDragging = false; });
    window.addEventListener('touchmove', (e) => {
      if (!this.enabled || !this.isDragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - this.lastMouse.x;
      const dy = e.touches[0].clientY - this.lastMouse.y;
      this.lastMouse.x = e.touches[0].clientX;
      this.lastMouse.y = e.touches[0].clientY;
      this.targetYaw -= dx * this.lookSpeed;
      this.targetPitch -= dy * this.lookSpeed;
      this.targetPitch = THREE.MathUtils.clamp(this.targetPitch, this.maxPitchDown, this.maxPitchUp);
      e.preventDefault();
    }, { passive: false });
  }

  setPosition(x, y, z) {
    this.position.set(x, y, z);
    this._updateCamera();
  }

  update(dt) {
    this.yaw += (this.targetYaw - this.yaw) * this.lerpFactor;
    this.pitch += (this.targetPitch - this.pitch) * this.lerpFactor;
    if (this.enabled) {
      const forward = new THREE.Vector3(-Math.sin(this.yaw), 0, -Math.cos(this.yaw));
      const right = new THREE.Vector3(Math.cos(this.yaw), 0, -Math.sin(this.yaw));
      const moveDir = new THREE.Vector3();
      if (this.keys.w) moveDir.add(forward);
      if (this.keys.s) moveDir.sub(forward);
      if (this.keys.a) moveDir.sub(right);
      if (this.keys.d) moveDir.add(right);
      if (moveDir.length() > 0) moveDir.normalize();
      this.targetVelocity.copy(moveDir).multiplyScalar(this.moveSpeed);
      this.velocity.lerp(this.targetVelocity, this.lerpFactor);
      this.position.x += this.velocity.x * dt;
      this.position.z += this.velocity.z * dt;
      this.position.x = THREE.MathUtils.clamp(this.position.x, this.boundaryMin.x, this.boundaryMax.x);
      this.position.z = THREE.MathUtils.clamp(this.position.z, this.boundaryMin.z, this.boundaryMax.z);
      this.position.y = THREE.MathUtils.clamp(this.position.y, this.boundaryMin.y, this.boundaryMax.y);
    }
    this._updateCamera();
  }

  _updateCamera() {
    this.camera.position.copy(this.position);
    const lookTarget = new THREE.Vector3(
      this.position.x - Math.sin(this.yaw) * Math.cos(this.pitch),
      this.position.y + Math.sin(this.pitch),
      this.position.z - Math.cos(this.yaw) * Math.cos(this.pitch)
    );
    this.camera.lookAt(lookTarget);
  }
}

// Preparation room interaction state
const prepState = { hpActive: false, vrActive: false, monitorBooting: false, monitorBooted: false, archiveActive: false, bootTime: 0 };
const handState = { phase: 'idle', startTime: 0, targetEquip: null };

function setPrepArchivePapersActive(active) {

function activatePrepArchiveSelection() {
  if (!prepState.monitorBooted || prepState.archiveActive) return;
  prepState.archiveActive = true;

  showMemoryToast({

function updateMemoryHover(dt, allowCursor = true) {
  if (!(phase === 'preparation' || phase.startsWith('zone'))) return false;
  raycaster.setFromCamera(mouseNorm, camera);
  const hits = raycaster.intersectObjects(memoryCards, false).filter(hit => hit.object.visible);
  const next = hits.length ? hits[0].object : null;
  if (next !== hoveredMemoryCard) {
    if (hoveredMemoryCard) {
      hoveredMemoryCard.material.opacity = hoveredMemoryCard.userData.baseOpacity || 0.5;
      hoveredMemoryCard.scale.set(1, 1, 1);
    }
    hoveredMemoryCard = next;
  }
  if (hoveredMemoryCard) {
    const base = hoveredMemoryCard.userData.baseOpacity || 0.5;
    hoveredMemoryCard.material.opacity += (Math.min(base + 0.22, 0.82) - hoveredMemoryCard.material.opacity) * Math.min(dt * 8, 1);
    const s = 1.025 + Math.sin(clock.getElapsedTime() * 4) * 0.006;
    hoveredMemoryCard.scale.set(s, s, s);
    if (allowCursor) renderer.domElement.style.cursor = 'pointer';

function handlePrepClick() {
  raycaster.setFromCamera(mouseNorm, camera);
  const hpGroup = prepGroup.userData.headphones;
  const vrGroup = prepGroup.userData.vrGlasses;
  const zoneDoors = prepGroup.userData.zoneDoors || [];

  if (prepState.monitorBooted && !prepState.archiveActive) {
    activatePrepArchiveSelection();
    return;
  }

  // Archive papers only become usable after the user explicitly unlocks the monitor.
  if (prepState.archiveActive) {
    for (const paper of zoneDoors) {
      const hits = raycaster.intersectObject(paper.hitPlane);
      if (hits.length > 0 && paper.active) {
        enterZone(paper.zone);
        return;
      }
    }
  }

  const hpHits = hpGroup ? raycaster.intersectObjects(hpGroup.children, true) : [];
  const vrHits = vrGroup ? raycaster.intersectObjects(vrGroup.children, true) : [];

  // Both hands appear together to pick up the clicked item
  if (hpHits.length > 0 && !prepState.hpActive && handState.phase === 'idle') {
    handState.phase = 'reach';
    handState.startTime = clock.getElapsedTime();
    handState.targetEquip = 'hp';
    prepGroup.userData.leftHand.visible = true;
    prepGroup.userData.rightHand.visible = true;
  }
  if (vrHits.length > 0 && !prepState.vrActive && handState.phase === 'idle') {
    handState.phase = 'reach';
    handState.startTime = clock.getElapsedTime();
    handState.targetEquip = 'vr';
    prepGroup.userData.leftHand.visible = true;
    prepGroup.userData.rightHand.visible = true;
  }
}

function handleZoneDoorClick() {
  const zoneIdx = parseInt(phase.replace('zone', ''), 10);
  if (!zoneIdx) return;
  const group = zoneConfigs[zoneIdx].group;
  raycaster.setFromCamera(mouseNorm, camera);

  // Check forward door
  let doorObj = null;
  if (zoneIdx === 1) doorObj = group.userData.doorMesh;
  else if (zoneIdx === 2) doorObj = group.userData.doorMesh;
  else if (zoneIdx === 3) doorObj = group.userData.doorGlow;
  else if (zoneIdx === 4) doorObj = group.userData.doorFrame;
  else if (zoneIdx === 5) doorObj = null;

  if (doorObj) {
    const hits = raycaster.intersectObjects([doorObj], true);
    if (hits.length > 0 && zoneIdx < 5) {
      enterZone(zoneIdx + 1);
      return;
    }
  }

  // Check back door
  let backDoorObj = null;
  if (zoneIdx === 1) backDoorObj = group.userData.backDoorMesh;
  else if (zoneIdx === 2) backDoorObj = group.userData.backDoorMesh;
  else if (zoneIdx === 3) backDoorObj = group.userData.backDoorHit;
  else if (zoneIdx === 4) backDoorObj = group.userData.backHitPlane;
  else if (zoneIdx === 5) backDoorObj = group.userData.backDoorPlane;

  if (backDoorObj) {
    const backHits = raycaster.intersectObjects([backDoorObj], true);
    if (backHits.length > 0) {
      if (zoneIdx === 1) {
        enterPreparation();
      } else {
        enterZone(zoneIdx - 1);
      }
    }
  }
}

function animateEquip(group, isActive, isHovered, dt) {
  if (!group) return;
  if (group.userData.baseY === undefined) group.userData.baseY = group.position.y;
  const targetY = (isHovered || isActive) ? group.userData.baseY + 0.04 : group.userData.baseY;
  group.position.y += (targetY - group.position.y) * Math.min(5 * dt, 1);
  const targetScale = (isHovered || isActive) ? 1.08 : 1.0;
  const s = group.scale.x + (targetScale - group.scale.x) * Math.min(5 * dt, 1);
  group.scale.set(s, s, s);
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

function animateHands(leftHand, rightHand, elapsed, targetEquip, itemGroup) {
  const reachDur = 0.5, liftDur = 0.95, fadeDur = 0.42;
  let itemPosL, itemPosR, facePosL, facePosR, itemTarget, targetScale;
  if (targetEquip === 'hp') {
    itemPosL = new THREE.Vector3(-0.82, 1.05, 0.54);
    itemPosR = new THREE.Vector3(-0.54, 1.05, 0.54);
    facePosL = new THREE.Vector3(-0.22, 1.04, 0.88);
    facePosR = new THREE.Vector3(0.22, 1.04, 0.88);
    itemTarget = new THREE.Vector3(-0.12, 1.08, 0.78);
    targetScale = 1.24;
  } else {
    itemPosL = new THREE.Vector3(0.54, 1.06, 0.54);
    itemPosR = new THREE.Vector3(0.82, 1.06, 0.54);
    facePosL = new THREE.Vector3(-0.18, 1.02, 0.9);
    facePosR = new THREE.Vector3(0.18, 1.02, 0.9);
    itemTarget = new THREE.Vector3(0.08, 1.06, 0.8);
    targetScale = 1.18;
  }
  const startPosL = new THREE.Vector3(-0.32, 0.72, 0.93);
  const startPosR = new THREE.Vector3(0.32, 0.72, 0.93);
  const outPosL = new THREE.Vector3(-0.42, 0.68, 0.98);
  const outPosR = new THREE.Vector3(0.42, 0.68, 0.98);
  const baseScale = 0.92;
  const palmScale = 1.04;

  if (itemGroup && !itemGroup.userData.pickBasePos) {
    itemGroup.userData.pickBasePos = itemGroup.position.clone();
    itemGroup.userData.pickBaseScale = itemGroup.scale.clone();
  }
  const itemBase = itemGroup?.userData.pickBasePos;
  const itemBaseScale = itemGroup?.userData.pickBaseScale || new THREE.Vector3(1, 1, 1);
  function setHandOpacity(opacity) {
    if (leftHand.userData.palmMat) leftHand.userData.palmMat.opacity = opacity;
    if (rightHand.userData.palmMat) rightHand.userData.palmMat.opacity = opacity;
  }
  function setHandScale(scale) {
    leftHand.scale.setScalar(scale);
    rightHand.scale.setScalar(scale);
  }

  let p;
  if (elapsed < reachDur) {
    p = easeOutCubic(elapsed / reachDur);
    leftHand.position.lerpVectors(startPosL, itemPosL, p);
    rightHand.position.lerpVectors(startPosR, itemPosR, p);
    leftHand.rotation.set(0, 0, -0.16);
    rightHand.rotation.set(0, 0, 0.16);
    setHandScale(baseScale + p * 0.08);
    setHandOpacity(0.04 + p * 0.42);
  } else if (elapsed < reachDur + liftDur) {
    p = easeInOutCubic((elapsed - reachDur) / liftDur);
    leftHand.position.lerpVectors(itemPosL, facePosL, p);
    rightHand.position.lerpVectors(itemPosR, facePosR, p);
    leftHand.rotation.set(0, 0, -0.08 + p * 0.12);
    rightHand.rotation.set(0, 0, 0.08 - p * 0.12);
    setHandScale(palmScale);
    setHandOpacity(0.46 * (1 - p * 0.22));
    if (itemGroup && itemBase) {
      itemGroup.position.lerpVectors(itemBase, itemTarget, p);
      const s = itemBaseScale.x + (targetScale - itemBaseScale.x) * p;
      itemGroup.scale.setScalar(s);
    }
  } else if (elapsed < reachDur + liftDur + fadeDur) {
    p = easeInCubic((elapsed - reachDur - liftDur) / fadeDur);
    leftHand.position.lerpVectors(facePosL, outPosL, p);
    rightHand.position.lerpVectors(facePosR, outPosR, p);
    setHandScale(palmScale * (1 - p * 0.12));
    setHandOpacity(0.36 * (1 - p));
    if (itemGroup && itemBase) {
      itemGroup.position.copy(itemTarget);
      itemGroup.scale.setScalar(targetScale * (1 - p * 0.1));
      if (p > 0.62) itemGroup.visible = false;
    }
  } else {
    if (itemGroup) itemGroup.visible = false;
    setHandOpacity(0);
    setHandScale(1);
    leftHand.visible = false;
    rightHand.visible = false;
    return true;
  }
  return false;
}

// ============================================================
// 7. Animation Loop
// ============================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  controller.update(dt);

  // Door hover in opening (only detect door meshes)
  if (phase === 'opening') {
    raycaster.setFromCamera(mouseNorm, camera);
    const doorMeshes = openingGroup.userData.doorMeshes || [];
    const hits = raycaster.intersectObjects(doorMeshes, true);
    const isHovering = hits.length > 0;
    if (isHovering !== doorHovered) {
      doorHovered = isHovering;
      renderer.domElement.style.cursor = doorHovered ? 'pointer' : 'default';
    }
  }

  // Preparation room equipment hover / interaction
  if (phase === 'preparation') {
    raycaster.setFromCamera(mouseNorm, camera);
    const memoryHover = updateMemoryHover(dt, false);
    const hpGroup = prepGroup.userData.headphones;
    const vrGroup = prepGroup.userData.vrGlasses;

    const hpHits = hpGroup ? raycaster.intersectObjects(hpGroup.children, true) : [];
    const vrHits = vrGroup ? raycaster.intersectObjects(vrGroup.children, true) : [];

    let newHover = null;
    // Only allow hover when item is visible and hand animation hasn't started
    if (hpHits.length > 0 && !prepState.hpActive && handState.phase === 'idle') newHover = 'hp';
    else if (vrHits.length > 0 && !prepState.vrActive && handState.phase === 'idle') newHover = 'vr';

    if (newHover !== hoveredEquip) {
      hoveredEquip = newHover;
    }
    let archiveHover = false;
    if (prepState.monitorBooted && !prepState.archiveActive && prepGroup.userData.monitorHitPlane) {
      archiveHover = raycaster.intersectObject(prepGroup.userData.monitorHitPlane).length > 0;
    } else if (prepState.archiveActive && prepGroup.userData.zoneDoors) {
      const paperHits = prepGroup.userData.zoneDoors
        .filter(p => p.active)
        .flatMap(p => raycaster.intersectObject(p.hitPlane).map(hit => ({ hit, paper: p })));
      archiveHover = paperHits.length > 0;
      prepGroup.userData.zoneDoors.forEach(p => {
        const target = paperHits.some(h => h.paper === p) ? 0.14 : 0.06;
        if (p.glow) p.glow.material.opacity += (target - p.glow.material.opacity) * Math.min(8 * dt, 1);
      });
    }
    renderer.domElement.style.cursor = (hoveredEquip || memoryHover || archiveHover) ? 'pointer' : 'default';

    // Guide icon fade in on hover
    const hpGuide = prepGroup.userData.hpGuide;
    const vrGuide = prepGroup.userData.vrGuide;
    if (hpGuide) {
      const targetOp = (hoveredEquip === 'hp') ? 1.0 : 0.0;
      hpGuide.material.opacity += (targetOp - hpGuide.material.opacity) * Math.min(5 * dt, 1);
    }
    if (vrGuide) {
      const targetOp = (hoveredEquip === 'vr') ? 1.0 : 0.0;
      vrGuide.material.opacity += (targetOp - vrGuide.material.opacity) * Math.min(5 * dt, 1);
    }

    // Animate equipments (float + scale on hover / active)
    animateEquip(hpGroup, prepState.hpActive, hoveredEquip === 'hp', dt);
    animateEquip(vrGroup, prepState.vrActive, hoveredEquip === 'vr', dt);

    // Animate hands picking up equipment (both hands together)
    const leftHand = prepGroup.userData.leftHand;
    const rightHand = prepGroup.userData.rightHand;
    if (handState.phase !== 'idle' && handState.phase !== 'done') {
      const elapsed = t - handState.startTime;
      const itemGroup = handState.targetEquip === 'hp' ? hpGroup : vrGroup;
      const done = animateHands(leftHand, rightHand, elapsed, handState.targetEquip, itemGroup);
      if (done) {
        if (itemGroup) itemGroup.visible = false;
        if (handState.targetEquip === 'hp') prepState.hpActive = true;
        else prepState.vrActive = true;
        handState.targetEquip = null;
        handState.phase = 'idle';
      }
    }

    // Start monitor boot-up when both equipments are worn
    if (prepState.hpActive && prepState.vrActive && !prepState.monitorBooting && !prepState.monitorBooted) {
      prepState.monitorBooting = true;
      prepState.bootTime = clock.getElapsedTime();
    }

    // Monitor boot-up animation
    if (prepState.monitorBooting) {
      const bootDuration = 3.5;
      const bootProgress = Math.min((t - prepState.bootTime) / bootDuration, 1.0);
      const ctx = prepGroup.userData.monitorCtx;
      const tex = prepGroup.userData.monitorTex;
      const glowMat = prepGroup.userData.monitorGlowMat;
      const screenMat = prepGroup.userData.monitorMat;

      // Clear
      ctx.fillStyle = '#020205';
      ctx.fillRect(0, 0, 512, 320);

      // Scanlines
      const scanY = ((bootProgress * 400) % 340) - 10;
      ctx.fillStyle = `rgba(80, 120, 140, ${0.15 + bootProgress * 0.2})`;
      for (let ly = 0; ly < 320; ly += 4) {
        ctx.fillRect(0, ly, 512, 1);
      }
      // Moving scan bar
      ctx.fillStyle = `rgba(100, 180, 220, ${0.3 + Math.sin(t * 8) * 0.15})`;
      ctx.fillRect(0, scanY, 512, 3);

      if (bootProgress > 0.2) {
        // Blueprint grid
        ctx.strokeStyle = `rgba(60, 100, 130, ${(bootProgress - 0.2) * 0.8})`;
        ctx.lineWidth = 1;
        for (let gx = 0; gx < 512; gx += 32) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 320); ctx.stroke(); }
        for (let gy = 0; gy < 320; gy += 32) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(512, gy); ctx.stroke(); }
      }

      if (bootProgress > 0.35) {
        // Simple wireframe building drawing
        ctx.strokeStyle = `rgba(120, 200, 220, ${(bootProgress - 0.35) * 1.5})`;
        ctx.lineWidth = 2;
        const cx = 256, cy = 180;
        const bW = 120, bH = 100;
        ctx.beginPath();
        ctx.moveTo(cx - bW / 2, cy + bH / 2); ctx.lineTo(cx - bW / 2, cy - bH / 2);
        ctx.lineTo(cx + bW / 2, cy - bH / 2); ctx.lineTo(cx + bW / 2, cy + bH / 2);
        ctx.closePath(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - bW / 2, cy - bH / 2); ctx.lineTo(cx - 20, cy - bH / 2 - 40); ctx.lineTo(cx + bW / 2, cy - bH / 2); ctx.stroke();
        // Windows
        ctx.strokeStyle = `rgba(180, 220, 240, ${(bootProgress - 0.35) * 1.2})`;
        ctx.lineWidth = 1;
        for (let wx = 0; wx < 3; wx++) {
          for (let wy = 0; wy < 3; wy++) {
            ctx.strokeRect(cx - 40 + wx * 35, cy - 20 + wy * 25, 20, 15);
          }
        }
      }

      if (bootProgress > 0.55) {
        // Text
        ctx.font = 'bold 18px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        const textAlpha = Math.min((bootProgress - 0.55) * 2.5, 1.0);
        ctx.fillStyle = `rgba(200, 230, 245, ${textAlpha})`;
        ctx.fillText('正在加载记忆档案...', 256, 280);
        ctx.font = '12px monospace';
        ctx.fillStyle = `rgba(140, 180, 200, ${textAlpha * 0.7})`;
        const progress = Math.min(((bootProgress - 0.55) / 0.45) * 100, 100).toFixed(0);
        ctx.fillText(`LOADING MEMORY SECTOR... ${progress}%`, 256, 300);
      }

      if (bootProgress > 0.85) {
        // Final flash
        const flash = (bootProgress - 0.85) * 6.0;
        ctx.fillStyle = `rgba(200, 230, 255, ${Math.min(flash, 0.25)})`;
        ctx.fillRect(0, 0, 512, 320);
      }

      tex.needsUpdate = true;

      // Intensify glow and emissive
      glowMat.opacity = 0.35 + bootProgress * 0.5;
      const emissiveInt = bootProgress * 0.3;
      screenMat.emissive.setRGB(emissiveInt * 0.3, emissiveInt * 0.5, emissiveInt * 0.6);

      // Boot complete — wait for the player to click the monitor before archive sheets become portals.
      if (bootProgress >= 1.0 && !prepState.monitorBooted) {
        prepState.monitorBooted = true;
        prepState.monitorBooting = false;
        drawMonitorArchivePrompt();
        setPrepArchivePapersActive(false);
      }
    }
  }

  // Zone door hover detection (forward + back doors)
  if (phase.startsWith('zone')) {
    const zoneIdx = parseInt(phase.replace('zone', ''), 10);
    const group = zoneConfigs[zoneIdx].group;
    raycaster.setFromCamera(mouseNorm, camera);
    let doorObj = null;
    if (zoneIdx === 1) doorObj = group.userData.doorMesh;
    else if (zoneIdx === 2) doorObj = group.userData.doorMesh;
    else if (zoneIdx === 3) doorObj = group.userData.doorGlow;
    else if (zoneIdx === 4) doorObj = group.userData.doorHitPlane || group.userData.doorFrame;
    else if (zoneIdx === 5) doorObj = null;
    let backDoorObj = null;
    if (zoneIdx === 1) backDoorObj = group.userData.backDoorMesh;
    else if (zoneIdx === 2) backDoorObj = group.userData.backDoorMesh;
    else if (zoneIdx === 3) backDoorObj = group.userData.backDoorHit;
    else if (zoneIdx === 4) backDoorObj = group.userData.backHitPlane;
    else if (zoneIdx === 5) backDoorObj = group.userData.backDoorPlane;
    let isHovering = false;
    if (doorObj) {
      const hits = raycaster.intersectObjects([doorObj], true);
      isHovering = hits.length > 0;
    }
    if (!isHovering && backDoorObj) {
      const backHits = raycaster.intersectObjects([backDoorObj], true);
      isHovering = backHits.length > 0;
    }
    const memoryHover = updateMemoryHover(dt, false);
    renderer.domElement.style.cursor = (isHovering || memoryHover) ? 'pointer' : 'default';
    // Zone 2 flicker + monitor screen glitch
    if (zoneIdx === 2 && group.userData.flicker) {
      group.userData.flicker.intensity = 1.0 + Math.sin(t * 12) * 0.4 + Math.sin(t * 23) * 0.3;
      group.userData.flicker.color.setHex(Math.sin(t * 3) > 0 ? 0xff0066 : 0x00e5ff);
    }
    if (zoneIdx === 2 && group.userData.monScreen) {
      group.userData.monScreen.material.opacity = 0.1 + Math.sin(t * 8) * 0.05 + Math.random() * 0.05;
    }
    // Zone 3 lamp flicker
    if (zoneIdx === 3 && group.userData.lampLight) {
      group.userData.lampLight.intensity = 0.5 + Math.sin(t * 2.5) * 0.15 + Math.sin(t * 7) * 0.05;
    }
    // Zone 4 blueprint screen float
    if (zoneIdx === 4 && group.userData.bpScreen) {
      group.userData.bpScreen.position.y = 2.02 + Math.sin(t * 0.8) * 0.01;
      group.userData.bpScreen.rotation.y = Math.sin(t * 0.3) * 0.006;
    }
    // Zone 5 postcards drift
    if (zoneIdx === 5) {
      for (let i = 0; i < 5; i++) {
        const pc = group.userData['postcard' + i];
        if (pc) {
          pc.position.y += Math.sin(t * 0.4 + i * 1.3) * 0.0003;
          pc.rotation.y += 0.0005 * Math.sin(t * 0.2 + i);
          pc.rotation.z = Math.sin(t * 0.3 + i * 0.8) * 0.05;
        }
      }
    }
  }
  if (!(phase === 'preparation' || phase.startsWith('zone')) && hoveredMemoryCard) {
    hoveredMemoryCard.material.opacity = hoveredMemoryCard.userData.baseOpacity || 0.5;
    hoveredMemoryCard.scale.set(1, 1, 1);
    hoveredMemoryCard = null;
  }
  if (memoryToast && memoryToast.classList.contains('visible') && t - memoryToastTimer > 3.0) {
    memoryToast.classList.remove('visible');
  }

  // Animate particles
  let activeGroup = openingGroup;
  if (phase === 'preparation') activeGroup = prepGroup;
  else if (phase === 'zone1') activeGroup = zone1Group;
  else if (phase === 'zone2') activeGroup = zone2Group;
  else if (phase === 'zone3') activeGroup = zone3Group;
  else if (phase === 'zone4') activeGroup = zone4Group;
  else if (phase === 'zone5') activeGroup = zone5Group;
  if (activeGroup.userData.particles) {
    const positions = activeGroup.userData.particles.geometry.attributes.position.array;
    const count = positions.length / 3;
    for (let i = 0; i < count; i++) {
      positions[i * 3] += Math.sin(t * 0.25 + i * 0.7) * 0.00025;
      positions[i * 3 + 1] += 0.0008 + Math.sin(t * 0.15 + i) * 0.00015;
      positions[i * 3 + 2] += Math.cos(t * 0.2 + i * 0.5) * 0.00025;
      if (positions[i * 3 + 1] > 5) {
        positions[i * 3 + 1] = 0.2;
        positions[i * 3] = (Math.random() - 0.5) * 8;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 8;
      }
    }
    activeGroup.userData.particles.geometry.attributes.position.needsUpdate = true;
  }

  dreamcorePass.uniforms.time.value = t;
  const prepMix = phase === 'preparation' ? 1.0 : 0.0;
  dreamcorePass.uniforms.prepAtmosphere.value += (prepMix - dreamcorePass.uniforms.prepAtmosphere.value) * Math.min(dt * 4, 1);
  dreamcorePass.uniforms.ssaoStrength.value = 0.34;
  dreamcorePass.uniforms.dofStrength.value = 0.52;
  composer.render();
}

animate();

// ============================================================
// 8. Resize
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  dreamcorePass.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
